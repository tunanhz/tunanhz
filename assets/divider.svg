<svg xmlns="http://www.w3.org/2000/svg" width="900" height="8" viewBox="0 0 900 8" preserveAspectRatio="none" role="img" aria-label="animated gradient divider">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- faint base line -->
  <rect x="0" y="3" width="900" height="2" rx="1" fill="url(#baseGrad)" opacity="0.35"/>
  <!-- bright segment sweeping across -->
  <rect x="-260" y="2" width="260" height="4" rx="2" fill="url(#sweepGrad)">
    <animate attributeName="x" from="-260" to="900" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
